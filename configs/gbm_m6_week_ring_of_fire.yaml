# Gradient-boosted trees vs. ETAS for "M>=6 in this region next week".
# Run: uv run spacegeo run configs/gbm_m6_week_ring_of_fire.yaml
#
# Pre-registered 2026-11-23, before any model in this config was scored.
# Design facts looked at beforehand (training span only): the share of
# training region-weeks with an M>=6 is 10.1% (M>=6.5: 3.6%, M>=7: 1.3%).
prereg:
  hypothesis: >-
    A gradient-boosted tree model (scikit-learn HistGradientBoosting, the
    XGBoost family) using seismicity-history features plus the ETAS forecast
    gives better probabilities for "at least one M>=6.0 in the region during
    the coming Monday-to-Monday week" than the ETAS forecast alone,
    recalibrated by logistic regression on the training span.
  comparison: >-
    ETAS-recalibrated: logistic regression on log(ETAS expected M>=6 count)
    fitted on training region-weeks. Also reported: raw ETAS probability
    1 - exp(-expected M>=6 count), and per-region climatology.
  metric: >-
    Information gain per region-week = mean over validation region-weeks of
    log p_model(outcome) - log p_reference(outcome), natural log (Bernoulli
    log score). 95% interval from a moving-block bootstrap over weeks
    (13-week blocks, all regions resampled together).
  success: >-
    Primary: information gain of gradient boosting over ETAS-recalibrated > 0
    with the 95% interval excluding 0, on validation weeks 2020-2025.
    Reported, not pass/fail: gain over climatology and over raw ETAS for every
    model, Brier skill score, ROC AUC, reliability table, the same comparison
    for M>=7.0 targets, and permutation importance of the boosting features.
  data: >-
    USGS ComCat M>=4.5 (data/catalog/comcat_M4.5), 17 regions from
    configs/ring_of_fire_scan.yaml. Features use only events before each week
    starts (Feature base class). ETAS per region is fitted on 2000-2019 (as in
    configs/etas_ring_of_fire.yaml) and its forecast for a week uses only
    events before that week (no cascades inside the week). Training
    region-weeks: 2001-01-01 to 2019-12-30 (2000 is history for features and
    ETAS burn-in). Validation: Monday weeks from 2020-01-06 to 2025-12-29.
    Test span (2026+) not loaded. Boosting hyperparameters fixed below, not
    tuned; no early stopping. Features (fixed): counts of M>=4.5 in the last
    7, 30 and 365 days and of M>=5.5 in the last 30 and 365 days (with log1p);
    largest magnitude in the last 7, 30 and 365 days; log days since the last
    M>=6 and M>=7 (20-year lookback); b-value of the last 200 events (5-year
    lookback); mean depth in the last 30 days; region (categorical); log ETAS
    expected M>=4.5 and M>=6 counts for the week.
  variants: 1
experiment: event_forecast
regions_file: configs/ring_of_fire_scan.yaml
catalog: data/catalog/comcat_M4.5
mc: 4.5
target_magnitude: 6.0
secondary_target_magnitude: 7.0
history_start: "2000-01-01T00:00:00Z"
train_start: "2001-01-01T00:00:00Z"
val_start: "2020-01-01T00:00:00Z"
val_end: "2026-01-01T00:00:00Z"
week_anchor: W-MON
bootstrap_block_weeks: 13
bootstrap_resamples: 2000
seed: 0
etas:
  t_max_days: 365
  r_max_km: 300
  burn_in_days: 365
  iterations: 5
  tolerance: 0.02
boosting:
  max_iter: 200
  learning_rate: 0.05
  max_depth: 3
  min_samples_leaf: 50
  l2_regularization: 1.0
  seed: 0
