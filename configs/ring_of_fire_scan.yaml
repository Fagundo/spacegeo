# Weekly seismicity anomaly scan along the Pacific Ring of Fire.
#
# Each region is one or more lat/lon boxes around a subduction / plate-boundary
# segment. Regions must not overlap (checked when the config loads); boxes
# share edges, and each box is half-open on its north and east edges. A box
# with lon_min > lon_max crosses 180 degrees.
#
# Split (see docs/experiments/anomaly-scan.md):
#   train 2000-2019  -> fit each region's weekly count model
#   val   2020-2025  -> check the p-values are calibrated (no fitting here)
#   test  2026 on    -> live weekly predictions, models refit on 2000-2025
#
# Catalog: everything M>=2.5 is downloaded (monthly chunks stay under the
# service's 20,000-event limit). Each region then gets its own magnitude of
# completeness, fitted on the training span only: maximum curvature + 0.2,
# taking the worst of the 5-year blocks so the cut holds in every era. Where
# ComCat has few small events (most non-US regions) the estimate lands near
# M4.5 or falls back to it. A region can pin its Mc with `mc:`.
catalog_min_magnitude: 2.5
download_chunk: MS
completeness:
  correction: 0.2
  block_years: 5
  min_events: 50
  fallback: 4.5
train_start: "2000-01-01T00:00:00Z"
val_start: "2020-01-01T00:00:00Z"
test_start: "2026-01-01T00:00:00Z"
horizon_days: 7
fdr: 0.05
week_anchor: W-MON  # weeks run Monday 00:00 UTC to Monday 00:00 UTC
regions:
  - name: alaska_aleutians
    boxes:
      - {lat_min_deg: 50, lat_max_deg: 65, lon_min_deg: 165, lon_max_deg: -135}
