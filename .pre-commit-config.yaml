# Install once: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: layer contracts
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: duplicate-code
        name: duplicate code (move shared code to common)
        entry: uv run pylint --disable=all --enable=duplicate-code src
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
