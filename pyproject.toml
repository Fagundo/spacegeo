[project]
name = "spacegeo"
version = "0.1.0"
description = "Tests whether space weather adds predictive information to earthquake forecasts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacegeo"]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pylint>=3.2",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "N",             # naming (PascalCase classes, snake_case functions)
    "UP",            # modern syntax
    "B",             # bugbear
    "A",             # no shadowing builtins
    "C4", "SIM", "RET",
    "C90",           # complexity: keeps methods small (SRP)
    "PL",            # pylint subset: too many args/branches/statements
    "ANN",           # type annotations everywhere
    "D",             # docstrings (google style)
    "DTZ",           # no naive datetimes
    "T20",           # no print()
    "ARG",           # no unused arguments
    "PTH",           # pathlib over os.path
    "SLF",           # no reaching into other objects' private members
    "TID",           # absolute imports only
    "PT",            # pytest style
    "RUF",
]
ignore = [
    "D105",    # magic-method docstrings
    "D107",    # __init__ docstrings (document the class instead)
    "ANN401",  # Any is occasionally the honest type
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004", "SLF001", "ARG"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

# ---------------------------------------------------------------- architecture
# Dependencies may only point downward. `lint-imports` fails the build otherwise.
[tool.importlinter]
root_package = "spacegeo"

[[tool.importlinter.contracts]]
name = "Layered architecture: each layer imports only the layers below it"
type = "layers"
layers = [
    "spacegeo.training",
    "spacegeo.evaluation",
    "spacegeo.models",
    "spacegeo.features",
    "spacegeo.data",
    "spacegeo.common",
]

[[tool.importlinter.contracts]]
name = "Data stages are independent: scraping, io and preprocessing share only common"
type = "independence"
modules = [
    "spacegeo.data.scraping",
    "spacegeo.data.io",
    "spacegeo.data.preprocessing",
]
