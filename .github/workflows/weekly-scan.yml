name: Weekly anomaly scan

# Downloads/refreshes the USGS ComCat archives in configs/catalogs.yaml and
# the space-weather archives in configs/space_weather.yaml, runs the Ring of
# Fire scan and commits the catalogs (data/catalog/), space weather
# (data/space_weather/) and results (results/anomaly/) to the branch it runs on.

on:
  schedule:
    - cron: "17 10 * * 1" # Mondays 10:17 UTC, after the week closes at 00:00 UTC
  workflow_dispatch:
    inputs:
      redo_validation:
        description: "Recompute the 2020-2025 validation even if stored"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Update catalog
        run: uv run python scripts/update_catalog.py
      - name: Update space weather
        # An SPDF/GFZ outage shows as a failed step but doesn't block the scan.
        continue-on-error: true
        run: uv run python scripts/update_space_weather.py
      - name: Validation (once)
        run: uv run python scripts/scan_anomalies.py validate ${{ inputs.redo_validation && '--force' || '' }}
      - name: Predict (all complete 2026+ weeks)
        run: uv run python scripts/scan_anomalies.py predict
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog data/space_weather results/anomaly
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly anomaly scan $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Job summary
        if: always()
        run: |
          if [ -f results/anomaly/test/latest.md ]; then
            cat results/anomaly/test/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
